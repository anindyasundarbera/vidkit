# Curated lint gate. The default ruleset of modern ruff (UP/RUF/FURB/PIE/…)
# is far broader than this project needs and would turn the gate into a
# restyling churn. We pin an explicit, conservative set — pyflakes (real bugs),
# the pycodestyle *errors* (not the line-length style), and import sorting —
# and ignore the two style-only codes the codebase deliberately uses:
#   E501  line length (the code favours long docstrings and calls)
#   E741  single-letter names like `l` in tight numeric loops
#
# Extending this file should be a considered decision (see DECISIONS.md), not
# a bump to the latest ruff default.

target-version = "py310"

[lint]
select = ["F", "E4", "E7", "E9", "I"]
ignore = ["E501", "E741"]

[lint.isort]
known-first-party = ["vidkit"]
