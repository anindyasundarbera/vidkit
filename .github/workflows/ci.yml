name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Unit tests
        run: python -m pytest tests -q --cov=vidkit --cov-fail-under=40 --cov-report=term-missing

  lint:
    name: lint and type (advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      # ruff is the gate: a curated ruleset that must be clean (see ruff.toml).
      - name: Lint
        run: ruff check vidkit tests

      # mypy is advisory to start — it surfaces drift without failing the build.
      # The real contract is the test suite; the type annotations are 93%
      # complete but not yet clean under a strict checker (see DECISIONS.md).
      - name: Type check (advisory)
        run: |
          python -m pip install mypy
          mypy vidkit || echo "::warning::mypy found issues (advisory — not blocking)"

  build-example:
    # The claim this repo makes is that a fresh clone can build a video with
    # nothing but ffmpeg + rsvg-convert. This job is what proves it.
    name: build hello-world end to end
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # rsvg-convert is required: it rasterises the SVG panels and stills.
      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg librsvg2-bin

      - name: Install vidkit
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Doctor
        run: vidkit doctor examples/hello-world/video.yaml

      - name: Plan
        run: vidkit plan examples/hello-world/video.yaml

      - name: Build
        run: vidkit build examples/hello-world/video.yaml

      # `vidkit build` already runs verify and exits non-zero on any failing
      # check, so this is a belt-and-braces assertion on the written report.
      # D17 / D15: a window that floats cannot be honestly described with dates,
      # and half a range is not a one-day window. Both are load-time refusals, so
      # neither costs a render to discover.
      - name: Refuse windows that cannot be stated honestly
        run: |
          set -eu
          python - <<'PY'
          import os, pathlib, re, subprocess, sys, tempfile

          EXAMPLE = pathlib.Path("examples/hello-world")
          spec = (EXAMPLE / "video.yaml").read_text(encoding="utf-8")
          # drop the pinned window so nothing but the variant under test declares one
          body = re.sub(r"^timeframe:\n(?:[ \t].*\n)*", "", spec, flags=re.M)
          assert "timeframe:" not in body, "the spec still declares a window"

          def try_plan(text: str, label: str) -> str:
              """Load `text` as the spec, with narration present, and expect a refusal."""
              with tempfile.TemporaryDirectory() as td:
                  d = pathlib.Path(td)
                  # mirror the example so narration and assets resolve exactly as
                  # they do in a real run; only video.yaml is a real file
                  for child in EXAMPLE.iterdir():
                      if child.name != "video.yaml":
                          os.symlink(child.resolve(), d / child.name)
                  (d / "video.yaml").write_text(text, encoding="utf-8")
                  cp = subprocess.run(
                      [sys.executable, "-m", "vidkit", "plan", str(d / "video.yaml")],
                      capture_output=True, text=True)
                  if cp.returncode == 0:
                      sys.exit(f"{label}: expected a refusal, got exit 0")
                  return (cp.stderr + cp.stdout).strip()

          # (a) a floating window, described in the narration with real dates
          out = try_plan(body.replace("voice:", "timeframe:\n  days: 30\n\nvoice:"),
                         "floating window")
          if "as_of" not in out:
              sys.exit(f"the floating-window refusal did not explain itself:\n{out}")
          print("floating window refused:", out.splitlines()[-1])

          # (b) half a range — an end with no start is not a one-day window
          out = try_plan(body.rstrip() + "\ntimeframe:\n  end: 2026-10-06\n",
                         "half a range")
          if "together" not in out:
              sys.exit(f"the half-range refusal did not explain itself:\n{out}")
          print("half a range refused:", out.splitlines()[-1])
          PY

      # R-A3 / R-F7 / M1 exit criterion, asserted in CI.
      - name: A different window is labelled, and a stale narration is rejected
        run: |
          set -eu
          # (a) `plan` resolves the override and prints it, so an agent can see
          #     what it is about to build before paying for a render.
          vidkit plan examples/hello-world/video.yaml \
            --timeframe 2026-08-01..2026-09-30 | grep -q "2026-08-01 to 2026-09-30"

          # (b) Building against that window FAILS verify, and the ONLY failing
          #     check is the timeframe one. This is the honesty engine doing its
          #     job: the narration still states 2026-09-07..2026-10-06, so the cut
          #     would be a lie. The window really is threaded, and it really is
          #     checked — the two halves of M1 are the same mechanism.
          if vidkit build examples/hello-world/video.yaml \
               --timeframe 2026-08-01..2026-09-30 --out _alt; then
            echo "expected the timeframe check to fail" >&2
            exit 1
          fi
          python - <<'PY'
          import json, pathlib, sys
          data = json.loads(pathlib.Path("_alt/_build/verify.json").read_text())
          bad = [c for c in data["checks"] if not c["ok"]]
          if [c["name"] for c in bad] != ["timeframe consistent with spec"]:
              sys.exit(f"unexpected failures: {bad}")
          print("caught:", bad[0]["detail"])
          PY

          # The same window re-verified standalone must reach the same verdict,
          # not a milder one — a render may not have two truths.
          if vidkit verify examples/hello-world/video.yaml \
               --timeframe 2026-08-01..2026-09-30 --out _alt; then
            echo "standalone verify disagreed with the build" >&2
            exit 1
          fi

          # (c) The narration is part of the story, so re-aiming the window means
          #     rewriting it. With the dates brought into line, the identical
          #     build succeeds and the re-aimed cut is correctly labelled.
          python - <<'PY'
          import pathlib
          p = pathlib.Path("examples/hello-world/narration.md")
          text = p.read_text(encoding="utf-8")
          text = text.replace("7 September 2026 to 6 October 2026",
                              "1 August 2026 to 30 September 2026")
          text = text.replace("2026-09-07 to 2026-10-06",
                              "2026-08-01 to 2026-09-30")
          p.write_text(text, encoding="utf-8")
          PY
          vidkit build examples/hello-world/video.yaml \
            --timeframe 2026-08-01..2026-09-30 --out _alt
          test -s _alt/hello-world.mp4

          # ...and the two builds really are two different cuts, described by
          # two different windows. The original build's report survives in the
          # spec folder, so it is still the record of the *first* window.
          python - <<'PY'
          import json, pathlib, sys
          a = json.loads(pathlib.Path(
              "examples/hello-world/_build/verify.json").read_text())
          b = json.loads(pathlib.Path("_alt/_build/verify.json").read_text())
          wa, wb = a["facts"]["timeframe"], b["facts"]["timeframe"]
          print("original:", wa["label"], f"[{wa['source']}]")
          print("re-aimed:", wb["label"], f"[{wb['source']}]")
          if (wa["start"], wa["end"]) == (wb["start"], wb["end"]):
              sys.exit("the override did not reach the build")
          if (wb["start"], wb["end"]) != ("2026-08-01", "2026-09-30"):
              sys.exit(f"wrong window in the re-aimed report: {wb}")
          if wb["source"] != "override":
              sys.exit(f"window provenance should say override: {wb['source']}")
          PY

      # R-A2: a scaffolded story is runnable, and its own window check passes.
      - name: Scaffold a story and verify it
        run: |
          vidkit init _scaffold --title "CI scaffold" --days 14 --as-of 2026-10-06
          vidkit plan _scaffold/video.yaml | tee /dev/stderr | grep -q "2026-09-23 to 2026-10-06"
          vidkit build _scaffold/video.yaml

      # R-G1/R-G2/R-G3 — the M5 exit criterion, walked the way an agent would
      # walk it. `--json run init` is checked *by its own action* (it once ran a
      # build because the verb `run` was mistaken for the action), `--progress`
      # is checked to leave stdout pure JSON, and `doctor` is checked to work
      # with no story at all, which is what a pre-flight check is for.
      - name: The whole loop is driveable from a shell, as JSON
        run: |
          set -euo pipefail
          probe="_agent_probe"
          rm -rf "$probe"; mkdir -p "$probe"

          vidkit --json doctor > "$probe/doctor.json"
          python -c "import json,sys; d=json.load(open('$probe/doctor.json')); assert d['ok'] and d['spec'] is None, d"

          vidkit --json run init --story "$probe/story" --title "Agent probe" \
            --days 14 --as-of 2026-10-06 > "$probe/init.json"
          python -c "import json,sys; d=json.load(open('$probe/init.json')); assert d['action']=='init' and d['ok'], d; assert len(d['created'])==4, d"

          vidkit --json plan "$probe/story/video.yaml" > "$probe/plan.json"
          python -c "import json,sys; d=json.load(open('$probe/plan.json')); assert d['ok'] and d['plan']['scenes'], d"

          vidkit --json --progress run build --story "$probe/story" --out "$probe/out" \
            > "$probe/build.json" 2> "$probe/build.log"
          python -c "import json,sys; d=json.load(open('$probe/build.json')); assert d['ok'] and d['report']['ok'], d"
          test -s "$probe/build.log"   # the run's own log really did reach stderr

          vidkit --json run verify --story "$probe/story" --out "$probe/out" > "$probe/verify.json"
          python -c "
          import json
          d = json.load(open('$probe/verify.json'))
          assert d['ok'] and d['report']['ok'], d
          assert d['timeline'], 'a verify must report the spans it looked at'
          "

          # R-F8 — every build leaves an identity, and verify reads it rather than
          # inventing a fresh one for somebody else's build
          python -c "
          import json
          b = json.load(open('$probe/build.json'))
          assert b['provenance'] and b['provenance']['action'] == 'build', b['provenance']
          assert b['artifacts']['provenance_json']['ok'], b['artifacts']
          v = json.load(open('$probe/verify.json'))
          assert v['provenance']['action'] == 'build', v['provenance']
          assert v['provenance']['spec_sha256'] == b['provenance']['spec_sha256']
          assert v['report']['facts']['provenance']['spec_sha256'], v.get('report')
          "
          vidkit --json provenance "$probe/story/video.yaml" --out "$probe/out" > "$probe/provenance.json"
          python -c "
          import json
          m = json.load(open('$probe/provenance.json'))
          assert m['ok'] and m['action'] == 'provenance', m
          d = m['provenance']
          assert d['schema'] == 1 and d['tools'], d
          assert {t['name'] for t in d['tools']} == {'ffmpeg','ffprobe','rsvg-convert','pdftoppm','gs'}
          assert all('present' in t for t in d['tools']), 'absent tools are recorded, not dropped'
          on_disk = json.load(open('$probe/out/_build/provenance.json'))
          assert d == on_disk, 'the manifest must carry the record verbatim, not a summary of it'
          b = json.load(open('$probe/build.json'))['provenance']
          assert d['spec_sha256'] == b['spec_sha256'], 'every reader must name the same build'
          "

          # a refusal is data, and it still names the window that was asked for
          vidkit --json run plan --story "$probe/story" --timeframe 3d \
            > "$probe/refused.json" || true
          python -c "
          import json
          d = json.load(open('$probe/refused.json'))
          assert d['ok'] is False, d
          assert d['failure']['kind'] and d['failure']['hint'], d
          assert d['timeframe']['days'] == 3, d
          "

      # R-B3 / R-B4 / R-B5 — the M2 exit criterion, asserted rather than claimed.
      # A build with `--only panels` must re-render from the snapshot, must NOT
      # reach the source, and must refuse a snapshot taken for a different window.
      # The evidence is a canary the provider appends to: a log line saying
      # "reusing snapshot" is a claim, an untouched file is a fact.
      - name: Re-render offline, and refuse a stale snapshot
        run: |
          set -eu
          probe=$(mktemp -d)
          mkdir -p "$probe/story"
          cat > "$probe/story/provider.py" <<'PY'
          from pathlib import Path

          CANARY = Path(__file__).resolve().parent / "canary.txt"


          def datasets(ctx):
              # append, so the file's *content* proves how many times we ran
              CANARY.write_text((CANARY.read_text() if CANARY.exists() else "") + ".")
              return {"n": {"headline": "1",
                            "cards": [{"label": "a", "value": "1"}]}}
          PY
          cat > "$probe/story/narration.md" <<'MD'
          # probe

          ## Scene 1 · 0:00 – 0:05

          **One.**
          MD
          cat > "$probe/story/video.yaml" <<'YAML'
          project:
            title: probe
            slug: probe
            output: probe.mp4
            size: [640, 360]
            fps: 12
          provider: provider
          timeframe: {start: 2026-01-01, end: 2026-01-31}
          charts:
            - name: n
              kind: stat_cards
              dataset: n
          scenes:
            - n: 1
              shots: [{chart: n, effect: hold}]
          narration: {source: narration.md}
          voice: {engine: none}
          guard:
            require_live_data: true
          YAML
          : > "$probe/story/canary.txt"          # empty

          vidkit build "$probe/story/video.yaml" --only data
          first=$(cat "$probe/story/canary.txt")
          test "$first" = "." || { echo "the data stage did not reach the provider" >&2; exit 1; }

          # (a) the exit criterion: panels render from disk, offline
          vidkit build "$probe/story/video.yaml" --only panels 2>&1 | tee "$probe/b.log"
          grep -q "reusing snapshot" "$probe/b.log"
          test -s "$probe/story/_build/stills/n.png"
          test "$(cat "$probe/story/canary.txt")" = "$first" \
            || { echo "--only panels re-ran the provider" >&2; exit 1; }
          echo "OFFLINE RE-RENDER OK — the source was not touched"

          # (b) a snapshot taken for another window must be refused, by name —
          #     and the refusal must happen before the source is touched
          if vidkit build "$probe/story/video.yaml" --only panels \
               --timeframe 2026-02-01..2026-02-28 > "$probe/c.log" 2>&1; then
            echo "expected a stale snapshot to be refused" >&2
            exit 1
          fi
          grep -q "snapshot is stale" "$probe/c.log"
          grep -q "2026-01-01 to 2026-01-31" "$probe/c.log"
          test "$(cat "$probe/story/canary.txt")" = "$first" \
            || { echo "a refused build reached the provider" >&2; exit 1; }
          echo "STALE SNAPSHOT REFUSED — with the recorded window named"

          # (c) --refresh is the documented way out
          vidkit build "$probe/story/video.yaml" --only panels --refresh
          test "$(cat "$probe/story/canary.txt")" = ".." \
            || { echo "--refresh did not re-ask the source" >&2; exit 1; }
          echo "REFRESH OK — the source was asked again"

          # (d) a missing snapshot is refused by path, never silently refetched
          rm -rf "$probe/story/_build/data"
          if vidkit build "$probe/story/video.yaml" --only panels > "$probe/d.log" 2>&1; then
            echo "expected a missing snapshot to be refused" >&2
            exit 1
          fi
          grep -q "no dataset snapshot" "$probe/d.log"
          test "$(cat "$probe/story/canary.txt")" = ".." \
            || { echo "a build with no snapshot reached the provider" >&2; exit 1; }
          echo "MISSING SNAPSHOT REFUSED — by path, without a refetch"

      # R-B4: a declared secret that is absent must fail loudly, and a present
      # one must never appear in the output. Both halves matter — a redaction bug
      # is a security-class bug, so it gets a CI step rather than a review note.
      - name: A missing secret fails loudly, a present one is never printed
        run: |
          set -eu
          secret='s3cret-value-that-must-not-be-printed'

          # (a) absent — and, just as important, *empty* — is not "set", and
          #     `doctor` on a real spec exits non-zero naming the variable
          ACME_TOKEN= python - <<'PY'
          import sys
          from vidkit.secrets import Secrets
          s = Secrets()
          s.declare({"ACME_TOKEN": "used to reach the ACME API"})
          s.resolve()
          print(*s.describe(), sep="\n")
          if not s.missing_required():
              sys.exit("an exported-but-empty variable was treated as set")
          if s.get("ACME_TOKEN") is not None:
              sys.exit("an empty variable produced a value")
          PY

          # (b) present — the inventory shows only the length, and the value is
          #     masked in a provider's own exception text (the leak path that
          #     actually matters: a 401 that echoes the token it sent)
          ACME_TOKEN="$secret" python - <<'PY'
          import sys
          from vidkit.secrets import Secrets
          s = Secrets()
          s.declare({"ACME_TOKEN": "used to reach the ACME API"})
          s.resolve()
          out = "\n".join(s.describe())
          out += "\n" + s.redact("upstream refused token " + s["ACME_TOKEN"])
          print(out)
          if "s3cret-value" in out:
              sys.exit("the secret value was printed")
          if "set (" not in out:
              sys.exit("the inventory did not report the variable as set")
          if "***" not in out:
              sys.exit("the secret was not masked in provider text")
          PY
          echo "SECRET CONTRACT OK — declared, resolved, masked"

      - name: Assert verification passed
        run: |
          python - <<'PY'
          import json, pathlib, sys
          report = pathlib.Path("examples/hello-world/_build/verify.json")
          if not report.exists():
              sys.exit("verify.json was not written")
          data = json.loads(report.read_text())
          for check in data["checks"]:
              print(f"[{'PASS' if check['ok'] else 'FAIL'}] {check['name']}")
          if not data["ok"]:
              sys.exit("verification reported failures")
          print("ALL PASS")
          PY

      - name: Assert artifacts exist
        run: |
          test -s examples/hello-world/hello-world.mp4
          test -s examples/hello-world/narration.srt

  capture-probe:
    # Capture v2's whole claim is "vidkit films a real product, including bytes it
    # downloads". That cannot be demonstrated by unit tests against a fake page, so
    # this job drives a real headless Chromium against a real local product page and
    # then asserts the artifact PNG is a PNG. The page is examples/capture-kit, which
    # needs no network.
    name: film a real page and a real download
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg librsvg2-bin poppler-utils

      - name: Install vidkit with the capture extra
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[capture]"

      - name: Install the browser Playwright drives
        run: python -m playwright install --with-deps chromium

      - name: Serve the kit on localhost
        run: |
          set -eu
          python examples/capture-kit/server.py --port 8765 &
          for _ in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8765/ >/dev/null; then exit 0; fi
            sleep 0.25
          done
          echo "capture-kit server never came up" >&2
          exit 1

      - name: Film it
        run: vidkit build examples/capture-kit/video.yaml

      # The refusals matter as much as the success: a capture whose assertion is
      # false must fail the build rather than quietly photograph the wrong state.
      - name: A capture that asserts the wrong state fails the build
        run: |
          set -eu
          python - <<'PY'
          import pathlib, re
          src = pathlib.Path("examples/capture-kit/video.yaml")
          text = src.read_text()
          broken = text.replace('contains: "5 rows"', 'contains: "nine hundred rows"')
          if broken == text:
              raise SystemExit("fixture changed: nothing to break")
          pathlib.Path("_capture_refusal/video.yaml").parent.mkdir(parents=True, exist_ok=True)
          pathlib.Path("_capture_refusal/video.yaml").write_text(broken)
          pathlib.Path("_capture_refusal/narration.md").write_text(
              pathlib.Path("examples/capture-kit/narration.md").read_text())
          PY
          if vidkit build _capture_refusal/video.yaml >/dev/null 2>&1; then
            echo "a false assertion did not fail the build" >&2
            exit 1
          fi
          echo "REFUSAL OK — a capture that asserts the wrong state fails loudly"

      - name: Assert the artifacts are real
        run: |
          set -eu
          python - <<'PY'
          import json, pathlib, struct, sys

          out = pathlib.Path("examples/capture-kit")
          csv = out / "_capture/artifacts/usage.csv"
          pdf = out / "_capture/artifacts/summary.pdf"
          for path in (csv, pdf):
              if not path.is_file() or path.stat().st_size == 0:
                  sys.exit(f"{path} is missing or empty — the download never landed")

          rows = csv.read_text().strip().splitlines()
          if rows[0] != "day,channel,visits,signups" or len(rows) != 6:
              sys.exit(f"usage.csv is not the five rows the page showed: {rows[:2]}")

          if not pdf.read_bytes().startswith(b"%PDF-"):
              sys.exit("summary.pdf is not a PDF")

          for name in ("csv_page", "pdf_page"):
              png = out / f"_capture/{name}.png"
              data = png.read_bytes()
              if data[:8] != b"\x89PNG\r\n\x1a\n":
                  sys.exit(f"{name}.png is not a PNG")
              width, height = struct.unpack(">II", data[16:24])
              if width < 200 or height < 200:
                  sys.exit(f"{name}.png is only {width}x{height}")

          report = json.loads((out / "_build/verify.json").read_text())
          checks = {c["name"]: c for c in report["checks"]}
          for want in ("all live captures present", "filmed artifacts are real files"):
              if not checks.get(want, {}).get("ok"):
                  sys.exit(f"verify check {want!r} did not pass")

          print(f"CAPTURE OK — {len(rows) - 1} real rows, a real PDF, "
                "two real artifact stills")
          PY

      - name: Assert artifacts exist
        run: |
          test -s examples/capture-kit/capture-kit.mp4
          grep -q "filmed artifacts are real files" examples/capture-kit/_build/verify.json

  exec-probe:
    # M7's whole claim is "vidkit films a real command, run in a real sandbox". A
    # unit test can assert that a PTY was opened and that argv was assembled; it
    # cannot assert that the finished film is a replay of the bytes the command
    # wrote. This job runs the command for real and then reads the report back.
    #
    # This job has to *build* the sandbox, not merely find it. The ubuntu-24.04
    # runner does not preinstall bubblewrap at all, and once installed the kernel
    # still refuses it: /proc/sys/kernel/apparmor_restrict_unprivileged_userns is
    # 1, so every bwrap invocation fails with "setting up uid map: Permission
    # denied", even without a single namespace flag. The sysctl below is what
    # lifts that. Without it the gate fails — which is the correct outcome, and
    # it is why the gate probes instead of checking `which bwrap`.
    #
    # No browser and no network: unlike capture-probe, nothing here leaves the
    # machine.
    name: run a real command and film it
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg librsvg2-bin bubblewrap

      - name: Let unprivileged user namespaces exist
        run: |
          # Ubuntu 24.04 ships an AppArmor rule that denies unprivileged user
          # namespaces, which is the mechanism bubblewrap is built on. The runner
          # has passwordless sudo, so the restriction can be lifted for this job.
          # Printing before/after makes a future failure diagnosable without a
          # diagnostic workflow: if "after" is still 1 the fix stopped working.
          echo "before: $(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)"
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          echo "after:  $(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)"

      - name: Install vidkit
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: The sandbox is really there, and really off the network
        run: |
          set -eu
          python - <<'PY'
          import sys
          sys.path.insert(0, ".")
          from vidkit import exec as ex
          ok, detail = ex.bwrap_available(refresh=True)
          if not ok:
              sys.exit(
                  "the sandbox cannot run on this runner, so this job would prove "
                  "nothing about confinement: " + detail)
          print("sandbox OK —", next(b for b in ex.backends_report() if b["name"] == "bubblewrap"))
          PY

      - name: Build the terminal demo
        run: vidkit build examples/terminal-demo/video.yaml

      - name: The film is a replay of the recording, and the report says so
        run: |
          python - <<'PY'
          import json, pathlib, sys
          out = pathlib.Path("examples/terminal-demo")
          report = json.loads((out / "_build" / "verify.json").read_text())
          if not report["ok"]:
              sys.exit(f"verification failed: {report['checks']}")

          checks = {c["name"]: c for c in report["checks"]}
          for want in ("every declared command ran",
                       "every command exited as declared",
                       "commands ran sandboxed"):
              if not checks.get(want, {}).get("ok"):
                  sys.exit(f"verify check {want!r} did not pass: {checks.get(want)}")

          facts = report["facts"]["exec"]
          if len(facts) != 3:
              sys.exit(f"expected 3 recorded commands, got {len(facts)}")
          for fact in facts:
              if not fact["cast"]:
                  sys.exit(f"{fact['label']} produced no cast to replay")
              # `frames: null` is a recorded fact, not a gap: it means the recording was
              # shown as a single held screen. Only a recording replayed as a moving take
              # carries a speed, and it must never be one that *slowed the film down*.
              if fact["frames"] is not None and fact["playback"] < 1.0:
                  sys.exit(f"{fact['label']} was re-timed to {fact['playback']}x")

          # The declared failure must be *reported as observed*, not hidden.
          failure = next(f for f in facts if f["label"] == "expected_failure")
          if failure["exit_code"] != 4 or not failure["expected"]:
              sys.exit(f"the declared failure was not recorded honestly: {failure}")

          # A cast is a recording, not a rendering: the command's own bytes are in it.
          cast = (out / "_build" / "exec" / facts[0]["cast"]).read_text()
          if "step 1 of 5" not in cast:
              sys.exit("the cast does not contain the command's own output")

          print(f"EXEC OK — {len(facts)} commands, all sandboxed, all replayed")
          PY

      - name: Assert artifacts exist
        run: |
          test -s examples/terminal-demo/terminal-demo.mp4
          test -s examples/terminal-demo/narration.srt

  docker-probe:
    # M8's claim is "vidkit starts a real service from a real image, runs the
    # declared commands *inside* that one container, and removes it again".
    # A unit test can assert that argv was assembled and that a container name
    # was generated; it cannot assert that a database really held a row across
    # two commands, or that nothing was left behind. This job does.
    #
    # This job has to *build* the capability, not merely find it: the runner's
    # docker group membership is not a given and the daemon may need starting.
    # The ladder below attempts each, prints what it measured either way, and
    # then the gate asks vidkit the same question and fails if vidkit disagrees.
    # That is deliberate — a gate that only proved the runner could run docker
    # would not prove that vidkit's own probe can see it.
    #
    # No browser and no network *from the film*: the image is pulled, and no
    # step declares `network`, so every command runs with the network off.
    name: run a real container, film it, and remove it
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg librsvg2-bin

      - name: Make a container runnable
        run: |
          # `set +e`: this is a ladder, not a contract. Each rung is recorded and
          # the verdict step below is what decides. `set -e` would abandon the
          # ladder at the first rung that is not needed.
          set +e

          if ! command -v docker >/dev/null 2>&1; then
            echo "rung 1: no docker client — installing"
            sudo apt-get install -y --no-install-recommends docker.io || true
          else
            echo "rung 1: docker client already present: $(command -v docker)"
          fi

          if ! docker info >/dev/null 2>&1; then
            echo "rung 2: the daemon does not answer — trying to start it"
            sudo systemctl start docker || sudo service docker start || true
            sleep 5
          fi
          docker info >/dev/null 2>&1 && echo "rung 2: the daemon answers" \
                                       || echo "rung 2: the daemon still does not answer"

          # The runner's user is not in the docker group, which the probes below
          # would otherwise attribute to vidkit. `sudo docker` is not a fix: the
          # engine calls the client as the current user.
          if ! docker info >/dev/null 2>&1; then
            echo "rung 3: granting $(id -un) access to the docker socket"
            sudo chmod 666 /var/run/docker.sock || true
          fi

          echo "--- what this runner actually has ---"
          docker version 2>&1 | sed -n '1,12p' || true
          docker info --format '{{.ServerVersion}} {{.Driver}}' 2>&1 || true
          exit 0

      - name: Install vidkit
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: The container really runs, and vidkit's own probe agrees
        run: |
          set -eu
          python - <<'PY'
          import sys
          sys.path.insert(0, ".")
          from vidkit import exec as ex

          rungs = ex.docker_rungs()
          for name in ("client", "daemon", "container"):
              row = rungs[name]
              print(f"rung {name}: {'ok ' if row['ok'] else 'NO '} {row['detail']}")

          ok, detail = ex.docker_available(refresh=True)
          if not ok:
              # Each rung has a different fix, so say which one broke.
              sys.exit("a container cannot run on this runner, so this job would "
                       "prove nothing about the environment lab: " + detail)

          row = next(b for b in ex.backends_report() if b["name"] == "docker")
          print("docker OK —", row)
          PY

      - name: Build the docker demo
        run: vidkit build examples/docker-demo/video.yaml

      - name: The service was really used, and really removed
        run: |
          python - <<'PY'
          import json, pathlib, sys
          out = pathlib.Path("examples/docker-demo")
          report = json.loads((out / "_build" / "verify.json").read_text())
          if not report["ok"]:
              sys.exit(f"verification failed: {report['checks']}")

          checks = {c["name"]: c for c in report["checks"]}
          for want in ("every declared command ran",
                       "every command exited as declared",
                       "commands ran sandboxed"):
              if not checks.get(want, {}).get("ok"):
                  sys.exit(f"verify check {want!r} did not pass: {checks.get(want)}")
          # "sandboxed" must mean *by Docker*, not by whatever else this runner has.
          if "docker" not in checks["commands ran sandboxed"]["detail"]:
              sys.exit(f"the commands were not confined by Docker: "
                       f"{checks['commands ran sandboxed']}")

          facts = report["facts"]["exec"]
          if len(facts) != 3:
              sys.exit(f"expected 3 recorded commands, got {len(facts)}")

          envs = report["facts"]["environments"]
          if len(envs) != 1:
              sys.exit(f"expected exactly 1 declared environment, got {len(envs)}")
          env = envs[0]
          if not env["ready"]:
              sys.exit(f"the service never became ready: {env['ready_detail']}")
          # A readiness check that sampled once would pass here and be wrong: the
          # detail records how long the answer *held*, which is the actual claim.
          if "without a single failure" not in env["ready_detail"]:
              sys.exit(f"readiness was not shown to hold: {env['ready_detail']}")
          if not env["image_digest"].startswith("sha256:"):
              sys.exit(f"the image was not identified by digest: {env['image_digest']}")

          # Every command ran inside the *same* container — that identity is what
          # makes "the row written by step 1 is read back by step 2" a fact rather
          # than a hope. A per-command `docker run` would break exactly this.
          containers = {f["container"] for f in facts}
          if len(containers) != 1 or not all(containers):
              sys.exit(f"the commands did not share one container: {containers}")
          name = containers.pop()
          if name != env["container_name"]:
              sys.exit(f"the commands ran in a container the spec did not declare: "
                       f"{name!r} vs {env['container_name']!r}")

          # Teardown is unconditional, and it must be *reported*, not assumed.
          if not env["teardown"]["removed"]:
              sys.exit(f"the container was not removed: {env['teardown']}")
          if not env["teardown"]["detail"].startswith("container "):
              sys.exit(f"teardown reported no detail: {env['teardown']}")

          # The causal claim: step 2's own recorded bytes contain the row step 1 wrote.
          write, read = next(f for f in facts if f["label"] == "write"), \
                        next(f for f in facts if f["label"] == "read")
          if not write["cast"] or not read["cast"]:
              sys.exit("a command produced no cast to replay")
          body = (out / "_build" / "exec" / read["cast"]).read_text()
          if "filmed, not drawn" not in body:
              sys.exit("the row written by the first command is not in the second "
                       "command's recording — the two did not share a database")
          if "1 |" not in body:
              sys.exit("the database did not assign the row its id — nothing was written")

          for fact in facts:
              if fact["frames"] is not None and fact["playback"] < 1.0:
                  sys.exit(f"{fact['label']} was re-timed to {fact['playback']}x")

          print(f"DOCKER OK — {len(facts)} commands in container {name}, "
                f"all sandboxed, service removed")
          PY

      - name: Nothing was left running on the runner
        run: |
          set -eu
          left=$(docker ps -a --filter name=vidkit- --format '{{.Names}}')
          if [ -n "$left" ]; then
            echo "the build leaked containers: $left"
            docker ps -a --filter name=vidkit-
            exit 1
          fi
          echo "no vidkit container remains"

      - name: Assert artifacts exist
        run: |
          test -s examples/docker-demo/docker-demo.mp4
          test -s examples/docker-demo/narration.srt

  movie-probe:
    # Movie mode's claim is that a film can be cut from *declared* artwork alone — no
    # browser, no provider, no network, no voice. That is precisely the case unit tests
    # cannot reach: it is a claim about what ffmpeg and rsvg produce together. This job
    # installs exactly those two tools and nothing else, so if the film renders it
    # renders for the reason the feature exists.
    name: cut a film from declared artwork alone
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system tools
        # ffmpeg and rsvg-convert, deliberately nothing else
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg librsvg2-bin

      - name: Install vidkit
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: The spec is well formed before anything is rendered
        run: |
          set -eu
          python -m vidkit doctor examples/movie-demo/video.yaml
          python -m vidkit plan examples/movie-demo/video.yaml

      - name: The plan is not allowed to disagree with the build
        # `plan` printed narration-derived estimates for a film whose every length is
        # declared, and warned about a runtime the build never produced. Both are now
        # computed by the one rule the renderer uses, so the two must agree — checked
        # here against the numbers the build actually produces.
        run: |
          set -eu
          python - <<'PY'
          import json, subprocess, sys
          from pathlib import Path

          plan = json.loads(subprocess.run(
              [sys.executable, "-m", "vidkit", "plan", "examples/movie-demo/video.yaml",
               "--json"], capture_output=True, text=True, check=True).stdout)["plan"]
          if plan["timing_source"] != "spec":
              sys.exit("the fixture's lengths are all declared, so timing must come "
                       f"from the spec, not from {plan['timing_source']!r}")
          declared = [s["declared_seconds"] for s in plan["scenes"]]
          if not all(d is not None for d in declared):
              sys.exit(f"a scene in this fixture has no declared length: {declared}")
          print(f"plan: {plan['planned_seconds']}s from {len(plan['takes'])} take(s), "
                f"timing from the spec, score {plan['score']['src']}")
          PY

      - name: Build the film
        run: python -m vidkit build examples/movie-demo/video.yaml

      - name: Every picture came from a declared asset, and the camera moved
        run: |
          set -eu
          python - <<'PY'
          import json, sys
          from pathlib import Path

          report = json.loads(
              Path("examples/movie-demo/_build/verify.json").read_text())
          if not report["ok"]:
              failed = [c["name"] for c in report["checks"] if not c["ok"]]
              sys.exit(f"the build did not verify: {failed}")
          facts = report["facts"]

          # 1. Nothing was fabricated: every shot names a declared asset as its source.
          # `artwork` is one row per shot; `artwork_sources` is the distinct set of
          # sources across those rows.
          artwork = facts["artwork"]
          if {r["source"] for r in artwork} != {"declared asset"}:
              sys.exit(f"a shot was not sourced from a declared asset: {artwork}")
          drawn = [r for r in artwork if r["kind"] in ("card", "solid")]
          if not drawn:
              sys.exit("the film drew no card and no solid — this job proves nothing")

          # 2. The camera moved, and the *engine* says so from what it rendered.
          # A declared move is a request; `mae` is the measurement. Every row must carry
          # one, a move over a field with nothing in it must measure exactly 0.0, and the
          # moves over real artwork must clear a threshold that a still could not.
          moving = facts["motion"]
          if len(moving) < 2:
              sys.exit(f"too few shots moved to be evidence: {moving}")
          if any(r.get("mae") is None for r in moving):
              sys.exit(f"a declared move was never measured: {moving}")
          MOVE_MAE = 0.10
          changed = [r for r in moving if r["mae"] > MOVE_MAE]
          if len(changed) < 3:
              sys.exit(f"fewer than three moves actually changed pixels: {moving}")
          # The one declared move over a flat field must be reported as exactly still,
          # and must not have been counted among the moves that changed the picture.
          flat = [r for r in moving if r["mae"] == 0.0]
          if len(flat) != 1:
              sys.exit(f"expected exactly one move over a flat field, got {flat}")
          if len(changed) + len(flat) != len(moving):
              sys.exit(f"a move was neither measured as changed nor as flat: {moving}")

          # 3. The clock came from the spec, not from an estimate of the wording.
          if facts["timing_source"] != "spec":
              sys.exit(f"timing came from {facts['timing_source']!r}")
          # This fixture is silent, so it must publish an *estimate* and never claim
          # spans. A `narration_spans` here would assert that seeking to those windows
          # plays the words, in a 16s film whose scenes' words would take 35.6s.
          if "narration_spans" in facts:
              sys.exit(f"a silent cut claimed measured narration spans: "
                       f"{facts['narration_spans']}")

          # 4. The score is either ducked or honestly reported as playing alone.
          score = facts["score"]
          if score["ducked"] is True and not score["duck_seconds"]:
              sys.exit("the mix claims to be ducked but ducked for no seconds")
          if score["ducked"] is False and score["duck_seconds"] != 0.0:
              sys.exit(f"the mix claims not to duck but reports "
                       f"{score['duck_seconds']}s of ducking")

          print(f"MOVIE OK — {len(artwork)} shot(s) from declared asset "
                f"({len(drawn)} drawn by the engine), {len(moving)} moving "
                f"({len(changed)} changed the picture, {len(flat)} over a flat field "
                f"measured 0.0), {facts['duration_seconds']}s, "
                f"score ducked={score['ducked']}")
          PY

      - name: Assert the artifacts exist and the score reached the mux
        run: |
          set -eu
          test -s examples/movie-demo/movie-demo.mp4
          test -s examples/movie-demo/narration.srt
          test -s examples/movie-demo/_build/mix.wav
          test -s examples/movie-demo/_build/verify.json
          # the film must actually carry the mixed track, not the silent stems
          probe=$(ffmpeg -i examples/movie-demo/movie-demo.mp4 2>&1 || true)
          echo "$probe" | grep -q "Audio:" || { echo "the film has no audio stream"; exit 1; }
          echo "artifacts ok"

  studio-probe:
    # M10's claim is not "there is a studio module" — it is "an external client, speaking
    # only MCP, can open a sitting against a spec, drive a live page, photograph it three
    # times, choose a take, assemble a film, read the report back, and close". Every part
    # of that crosses a boundary a unit test cannot: the wire is FastMCP's, the page is
    # Chromium's, and the film is ffmpeg's.
    #
    # This job exists because that claim was false in a way nothing local caught. FastMCP
    # runs a *sync* tool on the event loop, so Playwright's own sync API refused outright
    # and every browser tool was dead over the wire — always, and silently, because the
    # failure arrived as a JSON string. The two tests below drive the real transport for
    # that reason. They are then followed by an in-shell drive, because the tests build
    # into a discarded `tmp_path` and this job also wants to read what a *sitting* left on
    # disk: the record, the takes, and the report the client was handed.
    name: an MCP client takes a sitting end to end
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system tools
        # ffmpeg and rsvg-convert: the sitting ends in a real render
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg librsvg2-bin

      - name: Install vidkit
        # `[mcp]` is not optional here, because this job's whole point is to drive the
        # server over its own transport: the two tests it runs and the probe below both
        # `import mcp`. Installing only `[dev]` made them fail at *import* — a green
        # `capture-probe` and a red `studio-probe` for the same installed browser.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[mcp,dev]"
          python -m pip install playwright

      - name: Install a browser
        # `--with-deps` because the runner image does not carry Chromium's shared
        # libraries; without it the launch fails on a missing `.so`, which reads as
        # "playwright is broken" rather than "a library is missing".
        run: python -m playwright install --with-deps chromium

      - name: vidkit can see the browser it is about to drive
        run: |
          set -eu
          python - <<'PY'
          import json, subprocess, sys
          from vidkit import capture

          assert capture._playwright_available(), "playwright is not importable"

          # The probe must be vidkit's own, not this script's. `doctor` is the surface
          # an agent reads before spending a minute on a build, so if it cannot see the
          # browser then every browser tool is unreachable over MCP.
          out = subprocess.run([sys.executable, "-m", "vidkit", "doctor", "--json"],
                               capture_output=True, text=True, check=True)
          rows = {t["name"]: t for t in json.loads(out.stdout)["doctor"]["tools"]}
          assert rows["playwright"]["present"], rows["playwright"]
          assert rows["chrome/chromium"]["present"], rows["chrome/chromium"]
          print(f"doctor: playwright present, chromium at "
                f"{rows['chrome/chromium']['detail']}")
          PY

      - name: The sitting works over the wire
        run: |
          set -eu
          python -m pytest tests/test_studio.py -q \
            -k "sitting_end_to_end or second_tool_call" -p no:randomly

      - name: Drive a sitting from outside and keep what it left behind
        run: |
          set -eu
          python - <<'PY'
          import anyio, contextlib, json
          from pathlib import Path

          from mcp.client.session import ClientSession
          from mcp.shared.memory import create_client_server_memory_streams
          from vidkit import mcp_server as m

          @contextlib.asynccontextmanager
          async def mcp_session(server):
              """Drive the real low-level server over the stable in-memory transport."""
              async with create_client_server_memory_streams() as (client_side, server_side):
                  client_read, client_write = client_side
                  server_read, server_write = server_side
                  raw = next((getattr(server, name, None)
                              for name in ("_mcp_server", "_lowlevel_server")
                              if getattr(server, name, None) is not None), None)
                  assert raw is not None, f"no low-level MCP server in {type(server).__name__}"
                  async with anyio.create_task_group() as tg:
                      tg.start_soon(raw.run, server_read, server_write,
                                    raw.create_initialization_options())
                      try:
                          client = ClientSession(read_stream=client_read,
                                                 write_stream=client_write)
                          async with client:
                              await client.initialize()
                              yield client
                      finally:
                          tg.cancel_scope.cancel()

          out = Path("studio-out").resolve()
          story = Path("studio-story")
          story.mkdir(exist_ok=True)
          (story / "video.yaml").write_text("""
          project: {title: Studio probe, slug: studio-probe, output: probe.mp4,
                    min_seconds: 1, max_seconds: 30}
          guard: {require_audio: false}   # a declared silent cut, never an accidental one
          captures:
            - name: login
              url: "data:text/html,<h1 id=t>probe</h1>"
              actions:
                - {type: wait_for, selector: "#t"}
          narration: {inline: {0: "A live page, photographed three times."}}
          scenes:
            - n: 0
              id: one
              title: One
              shots:
                - {capture: login}
          """, encoding="utf-8")

          async def go():
              async def call(client, name, args):
                  answered = await client.call_tool(name, {"out": str(out), **args})
                  is_error = getattr(answered, "isError",
                                     getattr(answered, "is_error", False))
                  assert not is_error, (name, answered.content)
                  return json.loads(answered.content[0].text)

              async with mcp_session(m.build_server()) as client:
                  opened = await call(client, "session_open",
                                      {"spec": str(story / "video.yaml")})
                  sid = opened["id"]
                  assert Path(opened["record_dir"]) == out / ".vidkit" / "sessions", opened

                  opened_browser = await call(client, "browser_open",
                                              {"session": sid, "url": ""})
                  assert opened_browser["open"] is True, opened_browser

                  three = []
                  for take, back, fore in ((1, "#000000", "#000000"),
                                           (2, "#ff0000", "#00ff00"),
                                           (3, "#0000ff", "#ffff00")):
                      # the page has to differ between takes, or `select_take` is right
                      # to refuse to promote one of three identical pictures — and the
                      # colours are what let the *film* be checked below, rather than
                      # only the record that claims what the film was built from
                      await call(client, "browser_act", {"session": sid, "actions": [
                          {"type": "eval", "script":
                           f"document.body.style.background = {back!r};"
                           f"document.getElementById('t').style.color = {fore!r}"}]})
                      shot = await call(client, "browser_shot",
                                        {"session": sid, "name": "login", "take": take})
                      assert shot["promoted"] is False, shot
                      three.append(shot["digest"])
                  assert len(set(three)) == 3, f"three takes were not three pictures: {three}"
                  print(f"three distinct takes: {[d[:12] for d in three]}")

                  await call(client, "browser_close", {"session": sid})
                  picked = await call(client, "take_select",
                                      {"session": sid, "capture": "login", "take": 2})
                  assert picked["ok"] is True, picked

                  built = await call(client, "session_build", {"session": sid})
                  assert built["ok"] is True, built
                  report = await call(client, "session_report", {"session": sid})
                  assert report["ok"] is True, [c for c in report["report"]["checks"]
                                                if not c["ok"]]
                  await call(client, "session_close", {"session": sid})
                  return built, report["report"], three

          built, report, three = anyio.run(go)

          # The claim the whole job rests on, measured rather than re-read. Take 1
          # painted the page black and take 2 red, so if the render re-shot the page
          # instead of honouring the promotion the film is black and this fails. It is
          # the check that was missing when the build silently overwrote a chosen take
          # and the record went on naming it.
          from vidkit.ffmpeg import Ffmpeg

          film = Path(report["facts"]["output"])
          ff = Ffmpeg()
          rgb = ff.frame_rgb(film, ff.duration(film) * 0.5, Path("probe-frame.raw"))
          pixels = [rgb[i:i + 3] for i in range(0, len(rgb), 3)]
          mean = tuple(round(sum(p[c] for p in pixels) / len(pixels)) for c in range(3))
          assert mean[0] >= 200 and mean[1] <= 60 and mean[2] <= 60, (
              f"the middle frame of the delivered film averages {mean}, which is not "
              f"the red page the sitting selected — the build did not render it")

          Path("studio-probe.json").write_text(json.dumps(
              {"built": built, "report": report, "film_mean_rgb": mean,
               "take_digests": three}, indent=1))
          print(f"built {built['output']} in {built['seconds']}s, "
                f"{len(report['checks'])} checks passed, "
                f"selected take's frame is {mean}")
          PY

      - name: What the sitting left on disk is what the client was told
        run: |
          set -eu
          python - <<'PY'
          import hashlib, json, subprocess, sys
          from pathlib import Path

          probe = json.loads(Path("studio-probe.json").read_text())
          report = probe["report"]
          out = Path("studio-out")
          sessions = out / ".vidkit" / "sessions"

          # the film the client was told about
          film = out / "probe.mp4"
          assert film.is_file() and film.stat().st_size > 0, f"no film at {film}"
          assert probe["built"]["output"] == str(film.resolve()), probe["built"]

          # the report the client was handed, re-read from the file it named
          on_disk = json.loads((out / "_build" / "verify.json").read_text())
          assert on_disk["ok"] is True
          assert on_disk["checks"] == report["checks"], (
              "the report served over the wire is not the report on disk")

          # the record of the sitting, one file per session, closed and saved
          records = list(sessions.glob("*.json"))
          assert len(records) == 1, f"expected one session record, found {records}"
          record = json.loads(records[0].read_text())
          assert record["closed"] is not None, "the record does not say it was closed"
          assert json.loads(Path("studio-probe.json").read_text())["built"]["session"] \
              == record["id"]

          # the takes, and the one that was chosen. Take 1 keeps the bare name; later
          # takes sit beside it as `.takeN`, which is the convention `capture.take_name`
          # defines and the one the promotion reads.
          takes = sorted((out / "_capture").glob("login*"))
          assert len(takes) == 3, f"expected three takes on disk, found {takes}"
          assert {t.name for t in takes} == {
              "login.png", "login.take2.png", "login.take3.png"}, takes

          # `selected` is derived when the takes are listed, not written into the
          # record, so ask the listing rather than looking for a field the record
          # never had. `list_takes` re-hashes each file, so this also proves the file
          # the record names is still the file on disk.
          listed = json.loads(subprocess.run(
              [sys.executable, "-c",
               "import json,sys;from pathlib import Path;from vidkit import studio as s;"
               "r=s.Registry(sys.argv[1]);"
               "print(json.dumps(s.list_takes(r.load(sys.argv[2]))))",
               str(out), record["id"]],
              capture_output=True, text=True, check=True).stdout)
          chosen = [t for t in listed["takes"] if t["selected"]]
          assert len(chosen) == 1 and chosen[0]["take"] == 2, chosen
          assert chosen[0]["path"] == "_capture/login.take2.png", chosen

          # The promotion is a *copy onto the name the renderer reads*, so after it
          # both files are the same bytes by construction: comparing them cannot
          # fail and is not worth asserting. What is worth asserting is that the
          # name the pipeline reads now holds take 2's own bytes and not take 1's —
          # against the digest take 2 had before anything was promoted.
          promoted = (out / "_capture" / "login.png").read_bytes()
          assert hashlib.sha256(promoted).hexdigest()[:16] == probe["take_digests"][1], (
              f"the file the renderer reads holds {hashlib.sha256(promoted).hexdigest()[:16]}, "
              f"not take 2 ({probe['take_digests'][1][:16]})")
          assert hashlib.sha256(promoted).hexdigest()[:16] != probe["take_digests"][0], (
              "the file the renderer reads is still take 1 — the promotion did nothing")
          print(f"_capture/login.png now holds take 2's bytes "
                f"({probe['take_digests'][1][:12]}), not take 1's "
                f"({probe['take_digests'][0][:12]})")

          # and the film is built from those bytes, not merely from the record's
          # claim: take 1 painted the page black and take 2 red, so a build that
          # re-shot the page instead of honouring the promotion would be black
          mean = probe["film_mean_rgb"]
          assert mean[0] >= 200 and mean[1] <= 60 and mean[2] <= 60, (
              f"the middle frame of the delivered film averages {tuple(mean)}, "
              "which is not the take the record says is selected")
          print(f"film's middle frame averages {tuple(mean)} — the selected take, "
                "measured in the delivered file")

          # nothing was left running: no browser, no container, no environment
          assert not record.get("environments"), record.get("environments")
          print(f"STUDIO OK — {len(report['checks'])} checks, 3 takes, "
                f"chose take 2, frame {probe['film_mean_rgb']}, "
                f"{film.stat().st_size} bytes, record closed")
          PY
