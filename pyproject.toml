[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vidkit"
dynamic = ["version"]
description = "A demo video is a claim about a system. Declarative spec → narrated, captioned screencast, reopened and verified — drivable from a shell or an agent over MCP."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
  "PyYAML>=6,<7",       # YAML specs (JSON specs work without it)
]

[project.optional-dependencies]
capture = ["playwright>=1.40,<2"]
tts = ["piper-tts>=1.2,<2"]
mcp = ["mcp>=2.3.0,<3"]
dev = ["pytest>=7,<10"]

[project.scripts]
vidkit = "vidkit.cli:main"
vidkit-mcp = "vidkit.mcp_server:main"

[tool.setuptools.dynamic]
version = {attr = "vidkit._version.__version__"}

[tool.setuptools.packages.find]
include = ["vidkit*"]

[tool.setuptools]
license-files = ["LICENSE"]

[tool.setuptools.package-data]
vidkit = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
