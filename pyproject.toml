[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vidkit"
version = "0.1.0"
description = "Declarative toolkit for narrated, captioned screen-recording videos"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "PyYAML>=6",          # YAML specs (JSON specs work without it)
]

[project.optional-dependencies]
capture = ["playwright>=1.40"]
tts = ["piper-tts>=1.2"]
mcp = ["mcp>=1.20"]
dev = ["pytest>=7"]

[project.scripts]
vidkit = "vidkit.cli:main"
vidkit-mcp = "vidkit.mcp_server:main"

[tool.setuptools.packages.find]
include = ["vidkit*"]

[tool.setuptools]
license-files = ["LICENSE"]

[tool.setuptools.package-data]
vidkit = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
